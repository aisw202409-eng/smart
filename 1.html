<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>미세먼지 로봇 대시보드</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #101827,
      #18263a
    );

  color: white;

  min-height: 100vh;
}

.container {

  max-width: 700px;

  margin: auto;
}

h1 {

  text-align: center;

  margin-bottom: 25px;

  font-size: 28px;
}

.card {

  background: #202d40;

  border-radius: 20px;

  padding: 22px;

  margin-bottom: 18px;

  box-shadow:
    0 8px 25px rgba(0,0,0,0.25);
}

.title {

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 15px;
}


/* ==========================================
   IP 연결
========================================== */

.ip-box {

  display: flex;

  gap: 10px;

  flex-wrap: wrap;
}

.ip-input {

  flex: 1;

  min-width: 200px;

  padding: 15px;

  border: none;

  border-radius: 12px;

  background: #111a28;

  color: white;

  font-size: 17px;

  outline: none;
}

.ip-input:focus {

  outline: 2px solid #3498db;
}

.connect-btn {

  padding: 15px 22px;

  border: none;

  border-radius: 12px;

  background: #27ae60;

  color: white;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;
}

.connect-btn:active {

  transform: scale(0.95);
}

.connection {

  text-align: center;

  margin-top: 15px;

  color: #aaa;

  font-size: 14px;
}

.online {

  color: #00e676;
}

.offline {

  color: #ff5252;
}


/* ==========================================
   PM2.5
========================================== */

.pm25 {

  text-align: center;

  font-size: 60px;

  font-weight: bold;
}

.unit {

  text-align: center;

  color: #aaa;

  font-size: 16px;
}

.status {

  text-align: center;

  font-size: 25px;

  font-weight: bold;

  margin-top: 10px;
}

.good {

  color: #00e676;
}

.normal {

  color: #ffca28;
}

.bad {

  color: #ff5252;
}

.verybad {

  color: #e040fb;
}


/* ==========================================
   상태
========================================== */

.info {

  display: flex;

  justify-content: space-between;

  padding: 12px 0;

  border-bottom:
    1px solid #ffffff15;
}

.info:last-child {

  border-bottom: none;
}


/* ==========================================
   버튼
========================================== */

.buttons {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;
}

button {

  border: none;

  border-radius: 14px;

  padding: 18px 5px;

  color: white;

  font-size: 17px;

  cursor: pointer;

  background: #34495e;

  transition: 0.1s;
}

button:active {

  transform: scale(0.94);
}

.forward {

  background: #2980b9;
}

.left {

  background: #8e44ad;
}

.right {

  background: #8e44ad;
}

.back {

  background: #2980b9;
}

.stop {

  background: #e74c3c;
}

.auto {

  background: #27ae60;

  grid-column:
    span 3;
}


/* ==========================================
   기타
========================================== */

.footer {

  text-align: center;

  color: #777;

  font-size: 13px;

  margin-top: 20px;
}

.hidden {

  display: none;
}

</style>

</head>


<body>


<div class="container">


<h1>
  🌫️ 미세먼지 로봇
</h1>


<!-- ==========================================
     ESP32 연결
========================================== -->

<div class="card">

  <div class="title">
    🔌 ESP32 연결
  </div>


  <div class="ip-box">

    <input
      id="ipInput"
      class="ip-input"
      type="text"
      placeholder="ESP32 IP 주소"
      value="10.114.189.99"
    >


    <button
      class="connect-btn"
      onclick="connectESP32()"
    >
      연결
    </button>

  </div>


  <div
    id="connection"
    class="connection"
  >

    ESP32 IP를 입력하고 연결하세요.

  </div>

</div>


<!-- ==========================================
     미세먼지
========================================== -->

<div
  id="dashboard"
  class="hidden"
>


<div class="card">

  <div class="title">
    🌫️ 미세먼지 상태
  </div>


  <div
    id="pm25"
    class="pm25"
  >
    --
  </div>


  <div class="unit">

    PM2.5 μg/m³

  </div>


  <div
    id="airStatus"
    class="status"
  >

    측정 중...

  </div>

</div>


<!-- ==========================================
     로봇 상태
========================================== -->

<div class="card">

  <div class="title">

    🤖 로봇 상태

  </div>


  <div class="info">

    <span>
      현재 동작
    </span>

    <strong
      id="robotMode"
    >
      정지
    </strong>

  </div>


  <div class="info">

    <span>
      제어 모드
    </span>

    <strong
      id="controlMode"
    >
      자동
    </strong>

  </div>


  <div class="info">

    <span>
      미세먼지 반응
    </span>

    <strong
      id="reaction"
    >
      -
    </strong>

  </div>

</div>


<!-- ==========================================
     로봇 제어
========================================== -->

<div class="card">

  <div class="title">

    🎮 로봇 제어

  </div>


  <div class="buttons">


    <button
      class="forward"
      onclick="control('forward')"
    >

      ⬆<br>

      전진

    </button>


    <button
      class="left"
      onclick="control('left')"
    >

      ↩<br>

      좌회전

    </button>


    <button
      class="right"
      onclick="control('right')"
    >

      ↪<br>

      우회전

    </button>


    <button
      class="stop"
      onclick="control('stop')"
    >

      ■<br>

      정지

    </button>


    <button
      class="back"
      onclick="control('backward')"
    >

      ⬇<br>

      후진

    </button>


    <button
      class="auto"
      onclick="control('auto')"
    >

      🤖 자동 모드

    </button>


  </div>

</div>


<!-- ==========================================
     자동 운전 설명
========================================== -->

<div class="card">

  <div class="title">

    ℹ️ 자동 운전

  </div>


  <div class="info">

    <span>
      PM2.5 0~15
    </span>

    <strong class="good">
      좋음
    </strong>

  </div>


  <div class="info">

    <span>
      PM2.5 16~35
    </span>

    <strong class="normal">
      보통
    </strong>

  </div>


  <div class="info">

    <span>
      PM2.5 36 이상
    </span>

    <strong class="bad">
      좌우 반복
    </strong>

  </div>


</div>


</div>


<div class="footer">

  ESP32 PM2.5 Robot Dashboard

</div>


</div>


<script>


// ==================================================
// 현재 연결된 ESP32 주소
// ==================================================

let esp32URL = "";


// ==================================================
// 페이지 시작
// ==================================================

window.onload = function() {


  // 이전에 입력한 IP가 있으면 불러오기

  const savedIP =
    localStorage.getItem(
      "esp32_ip"
    );


  if (savedIP) {

    document.getElementById(
      "ipInput"
    ).value = savedIP;

  }

};


// ==================================================
// ESP32 연결
// ==================================================

async function connectESP32() {


  let ip =
    document.getElementById(
      "ipInput"
    ).value.trim();


  // ------------------------------------------
  // IP 입력 확인
  // ------------------------------------------

  if (ip === "") {

    alert(
      "ESP32의 IP 주소를 입력하세요."
    );

    return;
  }


  // ------------------------------------------
  // http:// 자동 추가
  // ------------------------------------------

  if (
    !ip.startsWith("http://") &&
    !ip.startsWith("https://")
  ) {

    ip =
      "http://" + ip;

  }


  // ------------------------------------------
  // 마지막 / 제거
  // ------------------------------------------

  ip =
    ip.replace(/\/+$/, "");


  // ------------------------------------------
  // 주소 저장
  // ------------------------------------------

  esp32URL = ip;


  // IP만 저장

  localStorage.setItem(
    "esp32_ip",
    ip
      .replace("http://", "")
      .replace("https://", "")
  );


  // ------------------------------------------
  // 연결 테스트
  // ------------------------------------------

  const connection =
    document.getElementById(
      "connection"
    );


  connection.innerHTML =
    "● 연결 확인 중...";


  try {


    const response =
      await fetch(
        esp32URL + "/api/status",
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "ESP32 응답 오류"
      );

    }


    const data =
      await response.json();


    // ----------------------------------------
    // 연결 성공
    // ----------------------------------------

    connection.innerHTML =
      '<span class="online">' +
      '● ESP32 연결 성공' +
      '</span>';


    document.getElementById(
      "dashboard"
    ).classList.remove(
      "hidden"
    );


    updateScreen(data);


  }

  catch(error) {


    console.log(error);


    connection.innerHTML =
      '<span class="offline">' +
      '● ESP32 연결 실패' +
      '</span>';


    document.getElementById(
      "dashboard"
    ).classList.add(
      "hidden"
    );


    alert(
      "ESP32에 연결할 수 없습니다.\n\n" +
      "IP 주소와 Wi-Fi 연결을 확인하세요.\n\n" +
      "입력한 주소:\n" +
      ip
    );

  }

}


// ==================================================
// 화면 업데이트
// ==================================================

function updateScreen(data) {


  // ------------------------------------------
  // PM2.5
  // ------------------------------------------

  const pm =
    document.getElementById(
      "pm25"
    );


  if (
    data.pm25 === undefined ||
    data.pm25 < 0
  ) {

    pm.innerText = "--";

  }
  else {

    pm.innerText =
      Number(data.pm25)
      .toFixed(1);

  }


  // ------------------------------------------
  // 대기 상태
  // ------------------------------------------

  const status =
    document.getElementById(
      "airStatus"
    );


  status.innerText =
    data.status;


  status.className =
    "status";


  if (data.pm25 <= 15) {

    status.classList.add(
      "good"
    );

  }

  else if (data.pm25 <= 35) {

    status.classList.add(
      "normal"
    );

  }

  else if (data.pm25 <= 75) {

    status.classList.add(
      "bad"
    );

  }

  else {

    status.classList.add(
      "verybad"
    );

  }


  // ------------------------------------------
  // 로봇 동작
  // ------------------------------------------

  document.getElementById(
    "robotMode"
  ).innerText =
    data.robotMode;


  // ------------------------------------------
  // 제어 모드
  // ------------------------------------------

  document.getElementById(
    "controlMode"
  ).innerText =
    data.manualMode
    ? "수동"
    : "자동";


  // ------------------------------------------
  // 미세먼지 반응
  // ------------------------------------------

  document.getElementById(
    "reaction"
  ).innerText =
    data.badAir
    ? "🔴 좌우 반복"
    : "🟢 오른쪽 회전";

}


// ==================================================
// 상태 업데이트
// ==================================================

async function updateStatus() {


  // 연결된 ESP32가 없으면 종료

  if (esp32URL === "") {

    return;
  }


  try {


    const response =
      await fetch(
        esp32URL +
        "/api/status",
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "응답 오류"
      );

    }


    const data =
      await response.json();


    // 화면 업데이트

    updateScreen(data);


    // 연결 상태 표시

    document.getElementById(
      "connection"
    ).innerHTML =
      '<span class="online">' +
      '● ESP32 연결됨' +
      '</span>';


  }

  catch(error) {


    console.log(
      "상태 업데이트 실패:",
      error
    );


    document.getElementById(
      "connection"
    ).innerHTML =
      '<span class="offline">' +
      '● ESP32 연결 끊김' +
      '</span>';

  }

}


// ==================================================
// 로봇 제어
// ==================================================

async function control(command) {


  // 연결 안 되어 있으면

  if (esp32URL === "") {

    alert(
      "먼저 ESP32에 연결하세요."
    );

    return;
  }


  try {


    const response =
      await fetch(
        esp32URL +
        "/" +
        command
      );


    if (!response.ok) {

      throw new Error(
        "제어 실패"
      );

    }


    // 상태 즉시 업데이트

    updateStatus();


  }

  catch(error) {


    console.log(
      "로봇 제어 오류:",
      error
    );


    alert(
      "ESP32와 연결이 끊어졌습니다."
    );

  }

}


// ==================================================
// 1초마다 상태 확인
// ==================================================

setInterval(
  updateStatus,
  1000
);


</script>


</body>

</html>
